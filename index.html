<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ImpactLens · Sign In</title>
<style>
  :root{
    --bg:#080828; --surface:#0e1036; --surface2:#141741;
    --soft:#f2f5fb; --muted:#aeb7d0; --faint:#7e89a8;
    --hair:rgba(235,244,255,.14); --hair2:rgba(235,244,255,.08);
    --gold:#FFBC3A; --teal:#40BDA9; --danger:#ff8470;
    --shadow:0 24px 60px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; font:15px/1.5 Arial,Helvetica,sans-serif; color:var(--soft);
    background:radial-gradient(circle at 80% 8%,rgba(77,136,232,.10),transparent 25%),
               radial-gradient(circle at 12% 76%,rgba(64,189,169,.06),transparent 25%), var(--bg);
    display:grid; place-items:center; padding:24px;
  }
  .shell{ width:100%; max-width:400px; }
  .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ display:flex; flex-direction:column; line-height:1.1; }
  .brand strong{ font-size:17px; letter-spacing:.02em; }
  .brand span{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--gold); margin-top:4px; }
  .langbtn{ background:none; border:1px solid var(--hair); color:var(--soft); border-radius:10px; padding:7px 14px; font-weight:800; font-size:12px; cursor:pointer; min-height:38px; }
  .langbtn:hover{ border-color:var(--gold); }
  .card{ padding:28px 24px; border:1px solid var(--hair); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--gold); }
  .h1{ font:500 26px/1.2 Georgia,'Times New Roman',serif; margin:6px 0 6px; color:#fff; }
  .sub{ margin:0 0 20px; color:var(--muted); font-size:13.5px; line-height:1.55; }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:800; color:var(--muted); }
  .field input{
    min-height:48px; border-radius:12px; border:1px solid var(--hair); background:var(--surface2);
    color:var(--soft); padding:0 14px; font:inherit; font-size:15px;
  }
  .field input:focus{ outline:none; border-color:rgba(255,188,58,.5); box-shadow:0 0 0 3px rgba(255,188,58,.14); }
  .btn{
    width:100%; min-height:50px; margin-top:6px; border-radius:12px; border:1px solid var(--gold);
    background:linear-gradient(180deg,rgba(255,188,58,.9),rgba(230,158,20,.95));
    color:#161200; font-weight:800; font-size:15px; cursor:pointer;
  }
  .btn:disabled{ opacity:.55; cursor:default; }
  .msg{ margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  .msg.error{ color:var(--danger); font-weight:700; }
  .msg.info{ color:var(--muted); }
  html[dir="rtl"] .field label{ text-align:right; }
  .logo-wrap{ text-align:center; margin-bottom:22px; }
  .logo-wrap img{ max-width:220px; width:60%; height:auto; }
</style>
</head>

        <input type="password" id="password" autocomplete="current-password" required>

<!-- Supabase backend (single self-contained file: SDK via CDN, config inlined
     below). This page only signs in and reads the caller's own role, then
     redirects -- it never touches manager.html or leader.html's own code. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_CONFIG = {
  url: "https://vtjvucrnczdekaxpbfsy.supabase.co",
  anonKey: "sb_publishable_-KrlOkjmflaOPw0bWZSwIw_MOPE9lsi",
};
const SUPABASE_CONFIG_READY = !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
var supabaseClient = null;
var SUPABASE_INIT_ERROR = null;
try {
  if (typeof window.supabase === "undefined") {
    SUPABASE_INIT_ERROR = "The Supabase SDK did not load. Check your internet connection and reload.";
  } else if (!SUPABASE_CONFIG_READY) {
    SUPABASE_INIT_ERROR = "Supabase is not configured.";
  } else {
    supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });
  }
} catch (e) {
  SUPABASE_INIT_ERROR = "Supabase failed to initialise: " + ((e && e.message) ? e.message : String(e));
}
function usernameToEmail(username) {
  return username.trim().toLowerCase() + "@living-leadership.internal";
}
</script>
<script>
(function(){
"use strict";

var STR = {
  en: {
    tag: "SIGN IN", eyebrow: "Living Leadership", title: "Sign in to continue",
    sub: "Every leader's journey starts with a single step forward.",
    user: "Username", pass: "Password", submit: "Start Your Journey", signing: "Starting your journey…",
    langBtn: "العربية",
    errBadLogin: "Incorrect username or password. Please try again.",
    errNoProfile: "Your account was found, but no profile is set up for it yet. Contact your administrator.",
    errUnknownRole: "Your account doesn't have a recognized role yet. Contact your administrator.",
    errGeneric: "Something went wrong. Please check your connection and try again.",
    redirecting: "Signed in — redirecting…",
  },
  ar: {
    tag: "تسجيل الدخول", eyebrow: "Living Leadership", title: "سجّل دخولك للمتابعة",
    sub: "رحلة كل قائد تبدأ بخطوة واحدة للأمام.",
    user: "اسم المستخدم", pass: "كلمة المرور", submit: "ابدأ رحلتك", signing: "جارٍ بدء رحلتك…",
    langBtn: "English",
    errBadLogin: "اسم المستخدم أو كلمة المرور غير صحيحة. حاول تاني.",
    errNoProfile: "الحساب موجود، بس لسه مفيش بروفايل متظبط ليه. كلّم المسؤول.",
    errUnknownRole: "الحساب ده مش متحدد له دور معروف. كلّم المسؤول.",
    errGeneric: "حصل خطأ. تأكد من الاتصال بالإنترنت وحاول تاني.",
    redirecting: "تم الدخول — بنوديك...",
  }
};

var lang = "en";
try { lang = (localStorage.getItem("impactlens_login_lang") || "en"); } catch(e) {}
if (lang !== "ar") lang = "en";
function t(){ return STR[lang]; }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  document.getElementById("tagText").textContent = t().tag;
  document.getElementById("eyebrowText").textContent = t().eyebrow;
  document.getElementById("titleText").textContent = t().title;
  document.getElementById("subText").textContent = t().sub;
  document.getElementById("userLabel").textContent = t().user;
  document.getElementById("passLabel").textContent = t().pass;
  document.getElementById("submitBtn").textContent = t().submit;
  document.getElementById("langBtn").textContent = t().langBtn;
}
document.getElementById("langBtn").onclick = function(){
  lang = (lang === "ar") ? "en" : "ar";
  try { localStorage.setItem("impactlens_login_lang", lang); } catch(e) {}
  applyLang();
};
applyLang();

function showMsg(text, kind){
  var el = document.getElementById("msg");
  el.textContent = text || "";
  el.className = "msg" + (kind ? " " + kind : "");
}

document.getElementById("loginForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var btn = document.getElementById("submitBtn");
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value;
  if (!username || !password) return;

  if (!supabaseClient) {
    showMsg(SUPABASE_INIT_ERROR || t().errGeneric, "error");
    return;
  }

  btn.disabled = true; btn.textContent = t().signing;
  showMsg("", "");

  try {
    var email = usernameToEmail(username);
    var signInRes = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if (signInRes.error) {
      console.error("Sign-in failed. Email tried:", email, "| Supabase error:", signInRes.error.message, "| status:", signInRes.error.status);
      showMsg(t().errBadLogin, "error");
      btn.disabled = false; btn.textContent = t().submit;
      return;
    }

    var userId = signInRes.data.user.id;
    var profRes = await supabaseClient.from("profiles").select("role").eq("id", userId).maybeSingle();
    if (profRes.error || !profRes.data) {
      showMsg(t().errNoProfile, "error");
      btn.disabled = false; btn.textContent = t().submit;
      return;
    }

    var role = profRes.data.role;
    showMsg(t().redirecting, "info");

    // Same-directory relative redirect: works regardless of hosting path
    // (GitHub Pages project site, custom domain, subfolder, etc.) as long as
    // manager.html / leader.html sit next to this file.
    if (role === "manager") {
      window.location.href = "manager.html";
    } else if (role === "participant") {
      window.location.href = "leader.html";
    } else {
      showMsg(t().errUnknownRole, "error");
      btn.disabled = false; btn.textContent = t().submit;
    }
  } catch (e) {
    console.error("Login error:", e);
    showMsg(t().errGeneric, "error");
    btn.disabled = false; btn.textContent = t().submit;
  }
});

// If a session already exists (e.g. user bookmarked this page while still
// signed in), skip straight to the right screen instead of showing the form.
(async function checkExistingSession(){
  if (!supabaseClient) return;
  try {
    var { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    var profRes = await supabaseClient.from("profiles").select("role").eq("id", session.user.id).maybeSingle();
    if (profRes.data && profRes.data.role === "manager") window.location.href = "manager.html";
    else if (profRes.data && profRes.data.role === "participant") window.location.href = "leader.html";
  } catch (e) { /* fall through to showing the login form */ }
})();
})();
</script>
